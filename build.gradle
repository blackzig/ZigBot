plugins {
    id 'application'
}

group = 'io.zigbot'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'io.zigbot.app.ZigBotApplication'
}

tasks.named('test') {
    useJUnitPlatform()
}
